name: Research kernel
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/jarvis
      - run: pytest -q
      - run: jarvis task validate examples/research_task.example.yaml
      - run: jarvis --store /tmp/jarvis-ci campaign start examples/research_task.example.yaml
      - run: jarvis --store /tmp/jarvis-dream-ci rsi study
      - run: jarvis --store /tmp/jarvis-space-ci rsi space --spec examples/hermes_search_space.example.yaml
      - run: jarvis --store /tmp/jarvis-iris-program-ci research fixture
      - run: jarvis --store /tmp/jarvis-hermes-dream-ci hermes-dream fixture
      - run: jarvis --store /tmp/jarvis-design-ci research design-fixture
      - run: jarvis --store /tmp/jarvis-critic-ci research critic-fixture
      - run: jarvis --store /tmp/jarvis-reviewed-dream-ci research dream-loop-fixture
      - run: jarvis --store /tmp/jarvis-lab-ci lab fixture
      - run: jarvis --store /tmp/jarvis-session-ci lab session-fixture
