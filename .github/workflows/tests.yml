name: Research kernel
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests scripts/iris_mission_supervisor.py
      - run: ruff format --check src tests scripts/iris_mission_supervisor.py
      - run: mypy src/jarvis scripts/iris_mission_supervisor.py
      - run: pytest -q
      - run: jarvis task validate examples/research_task.example.yaml
      - run: jarvis --store /tmp/jarvis-ci campaign start examples/research_task.example.yaml
      - run: jarvis --store /tmp/jarvis-dream-ci rsi study
      - run: jarvis --store /tmp/jarvis-space-ci rsi space --spec examples/hermes_search_space.example.yaml
      - run: jarvis --store /tmp/jarvis-iris-program-ci research fixture
      - run: jarvis --store /tmp/jarvis-hermes-dream-ci hermes-dream fixture
      - run: jarvis --store /tmp/jarvis-design-ci research design-fixture
      - run: jarvis --store /tmp/jarvis-critic-ci research critic-fixture
      - run: jarvis --store /tmp/jarvis-reviewed-dream-ci research dream-loop-fixture
      - run: jarvis --store /tmp/jarvis-lab-ci lab fixture
      - run: jarvis --store /tmp/jarvis-session-ci lab session-fixture
      - run: jarvis workflow preflight examples/mechanism-research/declaration.yaml
  isolated-skills:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: jarvis workflow sandbox-check
      - run: pytest -q tests/test_mechanism_research.py tests/test_reviewed_role_repairs.py
      - run: |
          jarvis --store "$RUNNER_TEMP/jarvis-mechanism-ci" workflow fixture > "$RUNNER_TEMP/mechanism-report.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'mechanism-report.json').read_text())
          assert report['status'] == 'VERIFIED'
          assert report['exact_replay']['status'] == 'COMPLETE'
          assert report['unknown_replay']['status'] == 'INSUFFICIENT_COVERAGE'
          assert report['external_llm_calls'] == report['remote_iris_submissions'] == 0
          print('Isolated skill construction, successor adoption and reviewed experiment: VERIFIED')
          PY
